global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # The Task Manager API, reached through the kubectl port-forward on the host.
  - job_name: task-api
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
        labels:
          service: task-api

  # Prometheus itself.
  - job_name: prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - localhost:9090
